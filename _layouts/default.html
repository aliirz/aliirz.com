<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>
  <div class="w">
    <header class="mast">
      {% if page.url == "/" or page.url == "/index.html" %}
      <h1 class="name"><a href="{{ "/" | relative_url }}">{{ site.title | escape }}<span class="caret" aria-hidden="true"></span></a></h1>
      {% else %}
      <a class="name" href="{{ "/" | relative_url }}">{{ site.title | escape }}<span class="caret" aria-hidden="true"></span></a>
      {% endif %}
      <div class="mast-end">
        <nav class="nav" aria-label="Site">
          <a href="{{ "/about/" | relative_url }}">about</a>
          <a href="{{ "/projects/" | relative_url }}">projects</a>
          <a href="{{ "/feed.xml" | relative_url }}">feed</a>
        </nav>
        <button type="button" class="theme-switch" id="theme-toggle" aria-pressed="false" aria-label="Theme follows the system setting">
          <span class="theme-glyph" aria-hidden="true"></span>
        </button>
      </div>
    </header>
    <main>
      {{ content }}
    </main>
    <footer class="colophon">
      <p><a href="mailto:{{ site.contact.email }}">{{ site.contact.email }}</a>
        · <a href="https://x.com/aliirz">@aliirz</a></p>
    </footer>
  </div>
  <script src="{{ "/assets/js/site.js" | relative_url }}"></script>
</body>
</html>
