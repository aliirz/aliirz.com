---
layout: default
---
<article class="post">
  <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>
  <h1>{{ page.title | escape }}</h1>
  {% if page.image %}
  <figure class="post-figure">
    <img src="{{ page.image | relative_url }}" alt="{{ page.title | escape }}">
  </figure>
  {% endif %}
  <div class="post-body">
    {{ content }}
  </div>
  {% if page.tags.size > 0 %}
  <p class="tags">
    {% for tag in page.tags %}
    <a href="{{ tag | tag_url }}">{{ tag | escape }}</a>
    {% endfor %}
  </p>
  {% endif %}
  <button type="button" class="kudos" data-kudos="{{ page.slug | escape }}" data-endpoint="{% if site.kudos_endpoint %}{{ site.kudos_endpoint | escape }}{% endif %}" aria-pressed="false" aria-label="Hold to give a kudo">
    <span class="kudos-ring" aria-hidden="true"><span class="kudos-fill"></span></span>
    <span class="kudos-label">kudos</span>
    <span class="kudos-count" aria-live="polite"></span>
  </button>
</article>
