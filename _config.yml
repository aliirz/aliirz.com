---
#-------------------------------
# General Site Settings
title: Ali Raza
logo: # You can add own logo. For example '/images/logo.png'.
description: I build software in Istanbul, and I write about what I actually learned building it.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://aliirz.com"

#-------------------------------
# Author Settings
author:
  name: Ali Raza
  bio: I build software in Istanbul, and I write about what I actually learned building it. Fractional CTO. Co-founder at BoostPanda.
  avatar: "/images/743962.jpeg"

social:
  - { icon: "ion-logo-twitter", label: X, link: "https://x.com/aliirz" }

#-------------------------------
# Hero Settings
hero:
  hero__title: Hey, I am Ali.
  hero__description: I build software in Istanbul, and I write about what I actually learned building it.
  hero__image: "/images/743962.jpeg"

#-------------------------------
# Newsletter (_includes/footer-widgets/widget-subscribe.html)
mailchimp: false # To enable the mailchimp form, use the value 'true'. To disable the form, use the value 'false' or leave the field blank.
mailchimp__title: Get interesting news # Add your Title
mailchimp__text: Subscribe to our newsletter and we will send you the emails of latest posts. # Add your description.
mailchimp__identifier: # Add your MailChimp form identifier. For example - blogenjoyfreedom.us16.list-manage.com/subscribe/post?u=cd56155d76ddeeb4c0bc4d080&amp;id=7a526cd13e
mailchimp__button__text: Join # Add your button text

#-------------------------------
# Contact Settings
contact:
  email: ali@aliirz.com
  description: ""

#-------------------------------
# Comment Section (Disqus)
disqus-identifier: aliirz # add your shortname for Disqus Comment. For example anvodstudio-demo

#-------------------------------
# Google Analytics
google-analytics: G-X5MSM54ZQZ # Add your identifier. For example UA-99631805-1.

#-------------------------------
# Build Settings
markdown: kramdown
permalink: /:title
future: true
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll/tagging
  - jekyll-feed
  - jekyll-seo-tag

feed:
  posts_limit: 1000

# Homepage lists every post. kudos-api is a separate service and must
# not be copied into the static site. `exclude` replaces Jekyll's
# defaults, so the usual entries stay listed here.
exclude:
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - kudos-api

# Public kudos counts. Leave blank and the button still animates
# and remembers a kudo in this browser; it just hides the number.
# Example: https://your-project.vercel.app/api/kudos
kudos_endpoint:

# Pages Path
defaults:
  - scope:
      path: "_pages"
    values:
      permalink: /:basename:output_ext

include:
  - _pages

# Tags
tag_page_dir: tag
tag_page_layout: tag_page
tag_permalink_style: /:title

twitter:
  username: aliirz
  card: summary_large_image
