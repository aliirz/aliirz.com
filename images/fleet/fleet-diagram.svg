<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>

  <rect width="1000" height="760" fill="#faf9f6"/>

  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">Five agents, one server, two Buzz relays</text>
  <text x="40" y="68" font-size="14" fill="#475569">How the fleet fits together</text>

  <!-- Relays -->
  <rect x="40" y="92" width="440" height="66" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="121" font-size="17" font-weight="700" fill="#0f172a">Buzz relay one</text>
  <text x="60" y="143" font-size="13" fill="#475569">mentions · replies · presence</text>

  <rect x="520" y="92" width="440" height="66" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="540" y="121" font-size="17" font-weight="700" fill="#0f172a">Buzz relay two</text>
  <text x="540" y="143" font-size="13" fill="#475569">mentions · replies · presence</text>

  <!-- Rumi -->
  <rect x="292" y="104" width="176" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="380" y="122" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Rumi</text>
  <text x="380" y="138" font-size="11" fill="#64748b" text-anchor="middle">reviewer, hosted elsewhere</text>

  <!-- Relay links -->
  <line x1="260" y1="162" x2="260" y2="208" stroke="#2563eb" stroke-width="2.5" marker-start="url(#a1)" marker-end="url(#a1)"/>
  <line x1="740" y1="162" x2="740" y2="208" stroke="#7c3aed" stroke-width="2.5" marker-start="url(#a2)" marker-end="url(#a2)"/>

  <!-- Server -->
  <rect x="40" y="212" width="920" height="318" rx="14" fill="#eef2f7" stroke="#cbd5e1" stroke-width="2"/>
  <text x="62" y="242" font-size="16" font-weight="700" fill="#0f172a" letter-spacing="0.5">ONE SERVER · DOCKER</text>
  <text x="938" y="242" font-size="13" fill="#475569" text-anchor="end">fleet.json → generated Compose + Ansible</text>

  <!-- Group one -->
  <rect x="62" y="258" width="436" height="222" rx="12" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="80" y="284" font-size="15" font-weight="700" fill="#1e3a8a">Relay one agents</text>

  <rect x="80" y="298" width="128" height="78" rx="10" fill="#fff" stroke="#bfdbfe"/>
  <text x="144" y="324" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">acodex</text>
  <text x="144" y="344" font-size="12" fill="#475569" text-anchor="middle">Codex</text>
  <text x="144" y="362" font-size="11" fill="#64748b" text-anchor="middle">subscription</text>

  <rect x="216" y="298" width="128" height="78" rx="10" fill="#fff" stroke="#bfdbfe"/>
  <text x="280" y="324" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">alphapi</text>
  <text x="280" y="344" font-size="12" fill="#475569" text-anchor="middle">Pi</text>
  <text x="280" y="362" font-size="11" fill="#64748b" text-anchor="middle">via OpenRouter</text>

  <rect x="352" y="298" width="128" height="78" rx="10" fill="#fff" stroke="#bfdbfe"/>
  <text x="416" y="324" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">aclaude</text>
  <text x="416" y="344" font-size="12" fill="#475569" text-anchor="middle">Claude Code</text>
  <text x="416" y="362" font-size="11" fill="#64748b" text-anchor="middle">subscription</text>

  <text x="80" y="404" font-size="12.5" fill="#334155">Own container, identity, home + workspace</text>
  <text x="80" y="426" font-size="12.5" fill="#334155">Sender allowlist: me + peers on this relay + Rumi</text>
  <text x="80" y="448" font-size="12.5" fill="#334155">Read-only secret mounts per agent</text>

  <!-- Group two -->
  <rect x="518" y="258" width="420" height="222" rx="12" fill="#f3ecfe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="536" y="284" font-size="15" font-weight="700" fill="#4c1d95">Relay two agents</text>

  <rect x="536" y="298" width="186" height="78" rx="10" fill="#fff" stroke="#ddd6fe"/>
  <text x="629" y="324" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">djangrok</text>
  <text x="629" y="344" font-size="12" fill="#475569" text-anchor="middle">Grok Build</text>
  <text x="629" y="362" font-size="11" fill="#64748b" text-anchor="middle">subscription</text>

  <rect x="734" y="298" width="186" height="78" rx="10" fill="#fff" stroke="#ddd6fe"/>
  <text x="827" y="324" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">codexcore</text>
  <text x="827" y="344" font-size="12" fill="#475569" text-anchor="middle">Codex</text>
  <text x="827" y="362" font-size="11" fill="#64748b" text-anchor="middle">subscription</text>

  <text x="536" y="404" font-size="12.5" fill="#334155">Own container, identity, home + workspace</text>
  <text x="536" y="426" font-size="12.5" fill="#334155">Sender allowlist: me + each other</text>
  <text x="536" y="448" font-size="12.5" fill="#334155">Read-only secret mounts per agent</text>

  <text x="62" y="510" font-size="12.5" fill="#475569">Non-root · read-only root filesystem · all capabilities dropped · memory and process limits per container</text>

  <!-- Bottom links -->
  <line x1="200" y1="534" x2="200" y2="586" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a1)"/>
  <line x1="500" y1="586" x2="500" y2="536" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#a3)"/>
  <line x1="800" y1="534" x2="800" y2="586" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- Bottom boxes -->
  <rect x="40" y="590" width="290" height="96" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="58" y="620" font-size="16" font-weight="700" fill="#0f172a">GitHub</text>
  <text x="58" y="644" font-size="13" fill="#475569">Scoped to one organization</text>
  <text x="58" y="666" font-size="12.5" fill="#64748b">clone · branch · push · review</text>

  <rect x="350" y="590" width="300" height="96" rx="10" fill="#fff" stroke="#c2410c" stroke-width="2"/>
  <text x="368" y="620" font-size="16" font-weight="700" fill="#0f172a">Credentials on the host</text>
  <text x="368" y="644" font-size="13" fill="#475569">Root-owned master files</text>
  <text x="368" y="666" font-size="12.5" fill="#64748b">explicit grant → read-only mount</text>

  <rect x="670" y="590" width="290" height="96" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="688" y="620" font-size="16" font-weight="700" fill="#0f172a">Tools &amp; repositories</text>
  <text x="688" y="644" font-size="13" fill="#475569">GitHub · Vercel · Meshy · ElevenLabs</text>
  <text x="688" y="666" font-size="12.5" fill="#64748b">explicitly granted access</text>

  <!-- Legend -->
  <text x="40" y="718" font-size="12.5" fill="#475569">↕ Relay links carry conversations. Solid arrows show granted access. Dashed arrow: credential provisioning.</text>
  <text x="40" y="740" font-size="12.5" fill="#475569">The two relays don't share conversations or access. A read-only mount doesn't make a token read-only.</text>
</svg>
