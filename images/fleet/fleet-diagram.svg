<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 1000 760"><defs><marker id="a1" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M0,0 L10,5 L0,10 z"/></marker><marker id="a2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#7c3aed" d="M0,0 L10,5 L0,10 z"/></marker><marker id="a3" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#c2410c" d="M0,0 L10,5 L0,10 z"/></marker><marker id="a4" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#64748b" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="1000" height="760" fill="#faf9f6"/><text x="40" y="44" fill="#0f172a" font-size="22" font-weight="700">Five agents, one server, two Buzz relays</text><text x="40" y="68" fill="#475569" font-size="14">How the fleet fits together</text><rect width="440" height="66" x="40" y="92" fill="#fff" stroke="#2563eb" stroke-width="2" rx="10"/><text x="60" y="121" fill="#0f172a" font-size="17" font-weight="700">Buzz relay one</text><text x="60" y="143" fill="#475569" font-size="13">mentions · replies · presence</text><rect width="440" height="66" x="520" y="92" fill="#fff" stroke="#7c3aed" stroke-width="2" rx="10"/><text x="540" y="121" fill="#0f172a" font-size="17" font-weight="700">Buzz relay two</text><text x="540" y="143" fill="#475569" font-size="13">mentions · replies · presence</text><rect width="176" height="42" x="292" y="104" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3" rx="8"/><text x="380" y="122" fill="#0f172a" font-size="13" font-weight="600" text-anchor="middle">Rumi</text><text x="380" y="138" fill="#64748b" font-size="11" text-anchor="middle">reviewer, hosted elsewhere</text><line x1="260" x2="260" y1="162" y2="208" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a1)" marker-start="url(#a1)"/><line x1="740" x2="740" y1="162" y2="208" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a2)" marker-start="url(#a2)"/><rect width="920" height="318" x="40" y="212" fill="#eef2f7" stroke="#cbd5e1" stroke-width="2" rx="14"/><text x="62" y="242" fill="#0f172a" font-size="16" font-weight="700" letter-spacing=".5">ONE SERVER · DOCKER</text><text x="938" y="242" fill="#475569" font-size="13" text-anchor="end">fleet.json → generated Compose + Ansible</text><rect width="436" height="222" x="62" y="258" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5" rx="12"/><text x="80" y="284" fill="#1e3a8a" font-size="15" font-weight="700">Relay one agents</text><rect width="128" height="78" x="80" y="298" fill="#fff" stroke="#bfdbfe" rx="10"/><text x="144" y="324" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">acodex</text><text x="144" y="344" fill="#475569" font-size="12" text-anchor="middle">Codex</text><text x="144" y="362" fill="#64748b" font-size="11" text-anchor="middle">subscription</text><rect width="128" height="78" x="216" y="298" fill="#fff" stroke="#bfdbfe" rx="10"/><text x="280" y="324" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">alphapi</text><text x="280" y="344" fill="#475569" font-size="12" text-anchor="middle">Pi</text><text x="280" y="362" fill="#64748b" font-size="11" text-anchor="middle">via OpenRouter</text><rect width="128" height="78" x="352" y="298" fill="#fff" stroke="#bfdbfe" rx="10"/><text x="416" y="324" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">aclaude</text><text x="416" y="344" fill="#475569" font-size="12" text-anchor="middle">Claude Code</text><text x="416" y="362" fill="#64748b" font-size="11" text-anchor="middle">subscription</text><text x="80" y="404" fill="#334155" font-size="12.5">Own container, identity, home + workspace</text><text x="80" y="426" fill="#334155" font-size="12.5">Sender allowlist: me + peers on this relay + Rumi</text><text x="80" y="448" fill="#334155" font-size="12.5">Read-only secret mounts per agent</text><rect width="420" height="222" x="518" y="258" fill="#f3ecfe" stroke="#7c3aed" stroke-width="1.5" rx="12"/><text x="536" y="284" fill="#4c1d95" font-size="15" font-weight="700">Relay two agents</text><rect width="186" height="78" x="536" y="298" fill="#fff" stroke="#ddd6fe" rx="10"/><text x="629" y="324" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">djangrok</text><text x="629" y="344" fill="#475569" font-size="12" text-anchor="middle">Grok Build</text><text x="629" y="362" fill="#64748b" font-size="11" text-anchor="middle">subscription</text><rect width="186" height="78" x="734" y="298" fill="#fff" stroke="#ddd6fe" rx="10"/><text x="827" y="324" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">codexcore</text><text x="827" y="344" fill="#475569" font-size="12" text-anchor="middle">Codex</text><text x="827" y="362" fill="#64748b" font-size="11" text-anchor="middle">subscription</text><text x="536" y="404" fill="#334155" font-size="12.5">Own container, identity, home + workspace</text><text x="536" y="426" fill="#334155" font-size="12.5">Sender allowlist: me + each other</text><text x="536" y="448" fill="#334155" font-size="12.5">Read-only secret mounts per agent</text><text x="62" y="510" fill="#475569" font-size="12.5">Non-root · read-only root filesystem · all capabilities dropped · memory and process limits per container</text><line x1="200" x2="200" y1="534" y2="586" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a1)"/><line x1="500" x2="500" y1="586" y2="536" stroke="#c2410c" stroke-dasharray="7 5" stroke-width="2.5" marker-end="url(#a3)"/><line x1="800" x2="800" y1="534" y2="586" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a2)"/><rect width="290" height="96" x="40" y="590" fill="#fff" stroke="#2563eb" stroke-width="2" rx="10"/><text x="58" y="620" fill="#0f172a" font-size="16" font-weight="700">GitHub</text><text x="58" y="644" fill="#475569" font-size="13">Scoped to one organization</text><text x="58" y="666" fill="#64748b" font-size="12.5">clone · branch · push · review</text><rect width="300" height="96" x="350" y="590" fill="#fff" stroke="#c2410c" stroke-width="2" rx="10"/><text x="368" y="620" fill="#0f172a" font-size="16" font-weight="700">Credentials on the host</text><text x="368" y="644" fill="#475569" font-size="13">Root-owned master files</text><text x="368" y="666" fill="#64748b" font-size="12.5">explicit grant → read-only mount</text><rect width="290" height="96" x="670" y="590" fill="#fff" stroke="#7c3aed" stroke-width="2" rx="10"/><text x="688" y="620" fill="#0f172a" font-size="16" font-weight="700">Tools &amp; repositories</text><text x="688" y="644" fill="#475569" font-size="13">GitHub · Vercel · Meshy · ElevenLabs</text><text x="688" y="666" fill="#64748b" font-size="12.5">explicitly granted access</text><text x="40" y="718" fill="#475569" font-size="12.5">↕ Relay links carry conversations. Solid arrows show granted access. Dashed arrow: credential provisioning.</text><text x="40" y="740" fill="#475569" font-size="12.5">The two relays don&apos;t share conversations or access. A read-only mount doesn&apos;t make a token read-only.</text></svg>