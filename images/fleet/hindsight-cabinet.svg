<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1000" height="560" fill="#faf6f0"/>

  <text x="40" y="46" font-size="22" font-weight="700" fill="#1c1917">One cabinet, three different doors</text>
  <text x="40" y="72" font-size="14" fill="#57534e">The bank is shared. Finding it is still a per-runtime problem.</text>

  <rect x="40" y="104" width="280" height="168" rx="14" fill="#fff" stroke="#a8a29e" stroke-width="2"/>
  <text x="60" y="138" font-size="15" font-weight="700" fill="#1c1917">Mnemosyne</text>
  <text x="60" y="162" font-size="13" fill="#57534e">A notebook in one pocket</text>
  <text x="60" y="190" font-size="13" fill="#44403c">SQLite, in-process</text>
  <text x="60" y="212" font-size="13" fill="#44403c">remember, recall, sleep</text>
  <text x="60" y="234" font-size="13" fill="#44403c">Fast. Local. Not shared.</text>
  <text x="60" y="256" font-size="12" fill="#78716c">The other robot cannot read it.</text>

  <rect x="360" y="96" width="300" height="184" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
  <text x="380" y="132" font-size="16" font-weight="700" fill="#1c1917">Hindsight bank</text>
  <text x="380" y="156" font-size="13" fill="#57534e">The cabinet</text>
  <text x="380" y="186" font-size="13" fill="#44403c">retain, recall, reflect</text>
  <text x="380" y="208" font-size="13" fill="#44403c">facts, author, source, time</text>
  <text x="380" y="230" font-size="13" fill="#44403c">Agents can add. They cannot delete.</text>
  <text x="380" y="256" font-size="12" fill="#9a3412">Git still wins an argument.</text>

  <path d="M320 188 H360" stroke="#c2410c" stroke-width="2" fill="none"/>
  <text x="328" y="178" font-size="11" fill="#9a3412">selected</text>
  <text x="332" y="208" font-size="11" fill="#9a3412">lessons</text>

  <rect x="40" y="320" width="280" height="150" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="60" y="354" font-size="15" font-weight="700" fill="#1c1917">codexcore</text>
  <text x="60" y="378" font-size="13" fill="#57534e">Codex, via MCP</text>
  <text x="60" y="408" font-size="13" fill="#44403c">The shell helper can't make</text>
  <text x="60" y="430" font-size="13" fill="#44403c">its namespaces in there.</text>
  <text x="60" y="452" font-size="12" fill="#6d28d9">MCP is the real door.</text>

  <rect x="360" y="320" width="280" height="150" rx="14" fill="#fff" stroke="#ea580c" stroke-width="2"/>
  <text x="380" y="354" font-size="15" font-weight="700" fill="#1c1917">aclaude</text>
  <text x="380" y="378" font-size="13" fill="#57534e">Claude Code</text>
  <text x="380" y="408" font-size="13" fill="#44403c">Looks only if CLAUDE.md</text>
  <text x="380" y="430" font-size="13" fill="#44403c">points at the cabinet.</text>
  <text x="380" y="452" font-size="12" fill="#c2410c">A nearby file is not a pointer.</text>

  <rect x="680" y="320" width="280" height="150" rx="14" fill="#fff" stroke="#b45309" stroke-width="2"/>
  <text x="700" y="354" font-size="15" font-weight="700" fill="#1c1917">djangrok</text>
  <text x="700" y="378" font-size="13" fill="#57534e">Grok Build, shell helper</text>
  <text x="700" y="408" font-size="13" fill="#44403c">Instructions were on disk.</text>
  <text x="700" y="430" font-size="13" fill="#44403c">The prompt never mentioned them.</text>
  <text x="700" y="452" font-size="12" fill="#b45309">He recalled nothing until asked.</text>

  <text x="40" y="520" font-size="13" fill="#57534e">Same bank. The fresh-session test is the one that counts: ask, and don't mention the cabinet.</text>
</svg>
