<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#faf6f0"/><text x="40" y="46" fill="#1c1917" font-size="22" font-weight="700">One cabinet, three different doors</text><text x="40" y="72" fill="#57534e" font-size="14">The bank is shared. Finding it is still a per-runtime problem.</text><rect width="280" height="168" x="40" y="104" fill="#fff" stroke="#a8a29e" stroke-width="2" rx="14"/><text x="60" y="138" fill="#1c1917" font-size="15" font-weight="700">Mnemosyne</text><text x="60" y="162" fill="#57534e" font-size="13">A notebook in one pocket</text><text x="60" y="190" fill="#44403c" font-size="13">SQLite, in-process</text><text x="60" y="212" fill="#44403c" font-size="13">remember, recall, sleep</text><text x="60" y="234" fill="#44403c" font-size="13">Fast. Local. Not shared.</text><text x="60" y="256" fill="#78716c" font-size="12">The other robot cannot read it.</text><rect width="300" height="184" x="360" y="96" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5" rx="14"/><text x="380" y="132" fill="#1c1917" font-size="16" font-weight="700">Hindsight bank</text><text x="380" y="156" fill="#57534e" font-size="13">The cabinet</text><text x="380" y="186" fill="#44403c" font-size="13">retain, recall, reflect</text><text x="380" y="208" fill="#44403c" font-size="13">facts, author, source, time</text><text x="380" y="230" fill="#44403c" font-size="13">Agents can add. They cannot delete.</text><text x="380" y="256" fill="#9a3412" font-size="12">Git still wins an argument.</text><path fill="none" stroke="#c2410c" stroke-width="2" d="M320 188 H360"/><text x="328" y="178" fill="#9a3412" font-size="11">selected</text><text x="332" y="208" fill="#9a3412" font-size="11">lessons</text><rect width="280" height="150" x="40" y="320" fill="#fff" stroke="#7c3aed" stroke-width="2" rx="14"/><text x="60" y="354" fill="#1c1917" font-size="15" font-weight="700">codexcore</text><text x="60" y="378" fill="#57534e" font-size="13">Codex, via MCP</text><text x="60" y="408" fill="#44403c" font-size="13">The shell helper can&apos;t make</text><text x="60" y="430" fill="#44403c" font-size="13">its namespaces in there.</text><text x="60" y="452" fill="#6d28d9" font-size="12">MCP is the real door.</text><rect width="280" height="150" x="360" y="320" fill="#fff" stroke="#ea580c" stroke-width="2" rx="14"/><text x="380" y="354" fill="#1c1917" font-size="15" font-weight="700">aclaude</text><text x="380" y="378" fill="#57534e" font-size="13">Claude Code</text><text x="380" y="408" fill="#44403c" font-size="13">Looks only if CLAUDE.md</text><text x="380" y="430" fill="#44403c" font-size="13">points at the cabinet.</text><text x="380" y="452" fill="#c2410c" font-size="12">A nearby file is not a pointer.</text><rect width="280" height="150" x="680" y="320" fill="#fff" stroke="#b45309" stroke-width="2" rx="14"/><text x="700" y="354" fill="#1c1917" font-size="15" font-weight="700">djangrok</text><text x="700" y="378" fill="#57534e" font-size="13">Grok Build, shell helper</text><text x="700" y="408" fill="#44403c" font-size="13">Instructions were on disk.</text><text x="700" y="430" fill="#44403c" font-size="13">The prompt never mentioned them.</text><text x="700" y="452" fill="#b45309" font-size="12">He recalled nothing until asked.</text><text x="40" y="520" fill="#57534e" font-size="13">Same bank. The fresh-session test is the one that counts: ask, and don&apos;t mention the cabinet.</text></svg>