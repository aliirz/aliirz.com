<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" aria-labelledby="pareto-title pareto-desc" role="img" viewBox="0 0 1200 700"><title id="pareto-title">Cost per task vs pass rate, all models combined</title><desc id="pareto-desc">Twenty-two harnesses plotted by average cost per task and pass rate, averaged over five models. The frontier is OpenCode v2, Pi, Codex CLI, and ZCode.</desc><rect width="1200" height="700" fill="#f0f0f0"/><text x="48" y="52" fill="#1e2740" font-family="Work Sans, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700">A higher cost did not buy a higher pass rate</text><text x="48" y="80" fill="#6a6d76" font-family="Work Sans, Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">Each point is one harness, averaged over all five models. The purple line is the Pareto frontier: nothing is both cheaper and more accurate.</text><line x1="110" x2="1140" y1="620" y2="620" stroke="#1e2740" stroke-width="1.5"/><line x1="110" x2="110" y1="140" y2="620" stroke="#1e2740" stroke-width="1.5"/><line x1="180.227" x2="180.227" y1="140" y2="620" stroke="#1e2740" stroke-opacity=".12" stroke-width=".6"/><line x1="180.227" x2="180.227" y1="620" y2="628" stroke="#1e2740" stroke-width="1.5"/><text x="180.227" y="648" fill="#6a6d76" font-family="Work Sans, Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">$0.55</text><line x1="414.318" x2="414.318" y1="140" y2="620" stroke="#1e2740" stroke-opacity=".12" stroke-width=".6"/><line x1="414.318" x2="414.318" y1="620" y2="628" stroke="#1e2740" stroke-width="1.5"/><text x="414.318" y="648" fill="#6a6d76" font-family="Work Sans, Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">$0.65</text><line x1="648.409" x2="648.409" y1="140" y2="620" stroke="#1e2740" stroke-opacity=".12" stroke-width=".6"/><line x1="648.409" x2="648.409" y1="620" y2="628" stroke="#1e2740" stroke-width="1.5"/><text x="648.409" y="648" fill="#6a6d76" font-family="Work Sans, Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">$0.75</text><line x1="882.5" x2="882.5" y1="140" y2="620" stroke="#1e2740" stroke-opacity=".12" stroke-width=".6"/><line x1="882.5" x2="882.5" y1="620" y2="628" stroke="#1e2740" stroke-width="1.5"/><text x="882.5" y="648" fill="#6a6d76" font-family="Work Sans, Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">$0.85</text><line x1="1116.591" x2="1116.591" y1="140" y2="620" stroke="#1e2740" stroke-opacity=".12" stroke-width=".6"/><line x1="1116.591" x2="1116.591" y1="620" y2="628" stroke="#1e2740" stroke-width="1.5"/><text x="1116.591" y="648" fill="#6a6d76" font-family="Work Sans, Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">$0.95</text><line x1="110" x2="1140" y1="603.448" y2="603.448" stroke="#1e2740" stroke-opacity=".12" stroke-width=".6"/><line x1="102" x2="110" y1="603.448" y2="603.448" stroke="#1e2740" stroke-width="1.5"/><text x="96" y="608.448" fill="#6a6d76" font-family="Work Sans, Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="end">50%</text><line x1="110" x2="1140" y1="537.241" y2="537.241" stroke="#1e2740" stroke-opacity=".12" stroke-width=".6"/><line x1="102" x2="110" y1="537.241" y2="537.241" stroke="#1e2740" stroke-width="1.5"/><text x="96" y="542.241" fill="#6a6d76" font-family="Work Sans, Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="end">52%</text><line x1="110" x2="1140" y1="471.034" y2="471.034" stroke="#1e2740" stroke-opacity=".12" stroke-width=".6"/><line x1="102" x2="110" y1="471.034" y2="471.034" stroke="#1e2740" stroke-width="1.5"/><text x="96" y="476.034" fill="#6a6d76" font-family="Work Sans, Inter, Helvetica, Arial, sans-serif" font-size="14" text-anchor="end">54%</text><line x1="110" x2="1140" y1="404.828" y2="404.828" stroke="#1e2740" stroke-opacity=".12" stroke-width=".6"/><line x1="102" x2="110" y1="404.828" y2="404.828" stroke="#1e2740" stroke-width="1.5"/><text x