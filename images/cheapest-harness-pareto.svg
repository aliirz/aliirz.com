<text x="48" y="80" font-family="Work Sans, Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6a6d76">Each point is one harness, averaged over all five models. The purple line is the Pareto frontier: nothing is both cheaper and more accurate.</text>
