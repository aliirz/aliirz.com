<title id="pareto-title">Cost per task vs pass rate, all models combined</title>
<desc id="pareto-desc">Twenty-two harnesses plotted by average cost per task and pass rate, averaged over five models. The frontier is OpenCode v2, Pi, Codex CLI, and ZCode.</desc>
