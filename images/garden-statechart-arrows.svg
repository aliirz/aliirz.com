<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="786" viewBox="0 0 1200 786" role="img" aria-labelledby="t d">
<title id="t">Every arrow in the send panel statechart, by the state it starts in and the state it ends in</title>
<desc id="d">The chart of the code as the agent wrote it has 39 arrows. 15 match the chart after the fix. 24 exist only in the code as written: 20 are a timer or the fake network firing in a state the user already left, 4 are the Send button working where the ticket offered a different button.</desc>
<rect width="1200" height="786" fill="#f0f0f0"/>
<text x="48" y="54" font-family="Work Sans, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1e2740">39 arrows, where 15 will do</text>
<text x="48" y="84" font-family="Work Sans, Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#6a6d76">Each cell is an arrow in the statechart: the state it leaves (row) and the state it lands in (column).</text>
