<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}">
  <link rel="icon" href="{{ "/favicon.svg" | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ "/favicon.ico" | relative_url }}">
  <link rel="apple-touch-icon" href="{{ "/apple-touch-icon.png" | relative_url }}">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.url == "/" or page.url == "/index.html" %}{{ site.title | escape }}{% else %}{{ page.title | escape }} – {{ site.title | escape }}{% endif %}">
  <meta name="twitter:description" content="{% if page.url == "/" or page.url == "/index.html" %}{{ site.description | strip_html | xml_escape }}{% elsif page.description %}{{ page.description | strip_html | xml_escape }}{% else %}{{ page.excerpt | strip_html | xml_escape }}{% endif %}">
  <meta name="twitter:image:src" content="{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ "/images/og-default.png" | absolute_url }}{% endif %}">

  <meta property="og:title" content="{% if page.url == "/" or page.url == "/index.html" %}{{ site.title | escape }}{% else %}{{ page.title | escape }} – {{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{% if page.url == "/" or page.url == "/index.html" %}{{ site.description | strip_html | xml_escape }}{% elsif page.description %}{{ page.description | strip_html | xml_escape }}{% else %}{{ page.excerpt | strip_html | xml_escape }}{% endif %}">
  <meta property="og:image" content="{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ "/images/og-default.png" | absolute_url }}{% endif %}">
  {% unless page.image %}
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  {% endunless %}
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">

  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (stored === "dark" || (!stored && prefersDark)) {
          document.documentElement.setAttribute("dark", "");
          document.documentElement.setAttribute("data-theme", stored === "dark" ? "dark" : "auto");
        } else if (stored === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  {% if site.google-analytics %}
    {% include google-analytics.html %}
  {% endif %}
</head>
