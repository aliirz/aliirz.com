<!-- begin footer -->
<footer class="footer">

  <div class="footer__inner">
    <div class="container">
      <div class="row">
        {% include footer-widgets/widget-info.html %}
        {% include footer-widgets/widget-subscribe.html %}
        {% include footer-widgets/widget-tags.html %}
      </div>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col col-12">
        <div class="footer__info">
          <div class="copyright">{{site.time | date: '%Y'}} &copy; <a href="/">{{site.title}}</a>. Crafted & Designed by <a href="https://jekyllthemes.io/developers/artem-sheludko">Artem Sheludko</a>.</div>
          <button type="button" class="toggle-theme" aria-label="Switch color theme">
            <span class="toggle-moon" aria-hidden="true"><i class="ion ion-ios-moon"></i></span>
            <span class="toggle-sun" aria-hidden="true"><i class="ion ion-ios-sunny"></i></span>
            <span class="toggle-thumb" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

</footer>
<!-- end footer -->
